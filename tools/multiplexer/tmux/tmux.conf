# portable-devenv tmux entry configuration

unbind C-b
unbind ,
unbind '"'
unbind l
unbind Left
unbind Down
unbind Up
unbind Right

set -g prefix C-a
bind C-a send-prefix

bind r command-prompt -I "#W" 'rename-window %%'
bind R command-prompt -I "#S" 'rename-session %%'
bind -r [ previous-window
bind -r ] next-window
bind Left select-pane -L
bind Down select-pane -D
bind Up select-pane -U
bind Right select-pane -R

set -g status-position top
set -g status-left '#[fg=green,bold]#S : '
set -g status-left-length 30
set -g status-right ' '
set -g window-status-current-format '#W'
set -g window-status-format '#W'
set -g history-limit 10000
set -g escape-time 0
set -g xterm-keys on

# tmux-256color is preferred only when the local terminfo database provides it.
if-shell '"$HOME/.tmux/portable-devenv/tmux-terminfo.sh"' 'set -g default-terminal "tmux-256color"' 'set -g default-terminal "screen-256color"'

if-shell '"$HOME/.tmux/portable-devenv/tmux-version.sh" --at-least 1.9' 'source-file "$HOME/.tmux/portable-devenv/tmux-path-modern.conf"' 'source-file "$HOME/.tmux/portable-devenv/tmux-path-legacy.conf"'
if-shell '"$HOME/.tmux/portable-devenv/tmux-version.sh" --at-least 2.1' 'source-file "$HOME/.tmux/portable-devenv/tmux-mouse-modern.conf"' 'source-file "$HOME/.tmux/portable-devenv/tmux-mouse-legacy.conf"'
if-shell '"$HOME/.tmux/portable-devenv/tmux-version.sh" --at-least 2.9' 'source-file "$HOME/.tmux/portable-devenv/tmux-style-modern.conf"' 'source-file "$HOME/.tmux/portable-devenv/tmux-style-legacy.conf"'
